<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Plunge!</title>
<meta name="description" content="Color Plunge! — a one-tap colour matching game for iOS and Android.">
<meta property="og:title" content="Color Plunge!">
<meta property="og:description" content="One tap. Match the colour. Don't blink.">
<meta property="og:type" content="website">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 3rem 1.5rem;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #e6e8ee;
    background: radial-gradient(1200px 800px at 50% -10%, #1a2140 0%, #0b0d17 60%);
  }
  main { max-width: 34rem; text-align: center; }

  .swatches { display: flex; gap: .6rem; justify-content: center; margin-bottom: 2rem; }
  .sw {
    width: 44px; height: 44px; border-radius: 12px;
    animation: pop 2.8s ease-in-out infinite;
  }
  .sw:nth-child(2) { animation-delay: .18s }
  .sw:nth-child(3) { animation-delay: .36s }
  .sw:nth-child(4) { animation-delay: .54s }
  .sw:nth-child(5) { animation-delay: .72s }
  @keyframes pop {
    0%, 62%, 100% { transform: translateY(0) scale(1); }
    72%           { transform: translateY(-9px) scale(1.06); }
  }
  @media (prefers-reduced-motion: reduce) { .sw { animation: none } }

  h1 { font-size: clamp(2.4rem, 8vw, 3.4rem); margin: 0 0 .6rem; letter-spacing: -.03em; }
  .tag { color: #9aa1b8; font-size: 1.1rem; margin: 0 0 2.5rem; }

  .links { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; min-height: 3rem; }
  .btn {
    display: inline-flex; align-items: center; gap: .5rem;
    padding: .72rem 1.35rem; border-radius: 999px;
    text-decoration: none; font-weight: 600; font-size: .95rem;
    border: 1px solid #2b3247; color: #e6e8ee;
    transition: border-color .15s, background .15s, transform .15s;
  }
  .btn:hover { border-color: #4dd4ff; background: rgba(77,212,255,.08); transform: translateY(-1px); }
  .btn.primary { background: #4dd4ff; color: #06121a; border-color: #4dd4ff; }
  .btn.primary:hover { background: #6fdcff; }
  .btn.soon {
    opacity: .55; cursor: default; border-style: dashed;
  }
  .btn.soon:hover { border-color: #2b3247; background: none; transform: none; }

  footer { margin-top: 3.5rem; color: #6a7286; font-size: .875rem; }
  footer a { color: #9aa1b8; }
  footer a:hover { color: #e6e8ee; }
</style>
</head>
<body>
<main>
  <div class="swatches" aria-hidden="true">
    <div class="sw" style="background:#ff4d6d"></div>
    <div class="sw" style="background:#4dd4ff"></div>
    <div class="sw" style="background:#ffd23f"></div>
    <div class="sw" style="background:#7bf1a8"></div>
    <div class="sw" style="background:#c77dff"></div>
  </div>

  <h1>Color Plunge!</h1>
  <p class="tag" id="tag">One tap. Match the colour. Don't blink.</p>

  <div class="links" id="links">
    <span class="btn soon">Loading…</span>
  </div>

  <footer>
    <a href="privacy.html">Privacy Policy</a> &middot;
    <a href="terms.html">Terms of Service</a> &middot;
    <a href="mailto:jacobmarx19@gmail.com">Contact</a>
  </footer>
</main>

<script>
// Store links live in links.json so there's exactly one place to update them.
// An empty value renders as "Coming soon" rather than a dead button — which
// matters here, because App Store review and TikTok's app review both look at
// this page, and a broken link reads worse than an honest placeholder.
(async () => {
  const el = document.getElementById('links');
  let cfg = {};
  try {
    cfg = await (await fetch('links.json', { cache: 'no-cache' })).json();
  } catch {
    // Opened via file:// or JSON is malformed — fail quiet, not broken.
  }

  if (cfg.tagline) document.getElementById('tag').textContent = cfg.tagline;

  const store = (url, label) => url
    ? `<a class="btn primary" href="${url}" rel="noopener">${label}</a>`
    : `<span class="btn soon">${label} — coming soon</span>`;

  const parts = [store(cfg.ios, 'Get it on iOS'), store(cfg.android, 'Get it on Android')];

  // Nothing shipped yet? Give people a way to hear about it.
  if (!cfg.ios && !cfg.android && cfg.notifyEmail) {
    parts.push(
      `<a class="btn" href="mailto:${cfg.notifyEmail}?subject=Notify%20me%20about%20Color%20Plunge">Notify me</a>`
    );
  }

  el.innerHTML = parts.join('');
})();
</script>
</body>
</html>
